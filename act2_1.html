<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원의 현 탐구 활동</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Noto Sans KR", sans-serif;
            background-color: #f5f7fa;
            color: #222;
        }

        header {
            background-color: #ffffff;
            padding: 40px 20px 30px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        header p {
            margin: 0;
            color: #666;
            font-size: 16px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* 선택 화면 */
        #menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .activity-button {
            min-height: 180px;
            border: none;
            border-radius: 16px;
            background-color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            padding: 30px;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
        }

        .activity-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .number {
            display: inline-block;
            margin-bottom: 20px;
            padding: 6px 12px;
            border-radius: 20px;
            background-color: #eef2ff;
            color: #4f46e5;
            font-size: 14px;
            font-weight: bold;
        }

        .activity-button h2 {
            margin: 0 0 12px;
            font-size: 22px;
        }

        .activity-button p {
            margin: 0;
            color: #666;
            line-height: 1.6;
        }

        /* GeoGebra 화면 */

        .activity-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        .activity-header h2 {
            margin: 0;
            font-size: 26px;
        }

        .back-button {
            border: none;
            background-color: #ffffff;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .back-button:hover {
            background-color: #f0f0f0;
        }

        .geogebra-container {
            width: 400px;
            max-width: 100%;
            margin: 0 auto;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .geogebra-container iframe {
            display: block;
            width: 400px;
            max-width: 100%;
            height: 500px;
            border: 0;
        }

        @media (max-width: 700px) {
            #menu {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 26px;
            }

            .activity-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .geogebra-container iframe {
                height: 550px;
            }
        }
    </style>
</head>

<body>
    
<header>
    <h1>원의 중심에서 현까지의 거리와 현의 길이</h1>
    <p>GeoGebra를 활용하여 원의 현의 성질을 탐구해 봅시다.</p>
</header>    

<div class="container">

    <section id="activity">

        <div class="activity-header">

            <h2>원의 중심에서 현까지의 거리와 현의 길이</h2>

            <button class="back-button" onclick="window.location.href='act2.html'">
                ← 활동 선택
            </button>

        </div>

        <div class="geogebra-container">

            <iframe
                src="https://www.geogebra.org/material/iframe/id/u8wfa8md/width/400/height/500/border/888888/sfsb/true/smb/false/stb/true/stbh/false/ai/false/sri/true/rc/false/ld/false/sdz/false/ctl/false"
                id="geogebra-frame"
                scrolling="no"
                allowfullscreen>
            </iframe>

        </div>

        <br>

        <div style="text-align: center;">
            <button class="back-button" onclick="window.location.href='act2_2.html'">
                → 다음
            </button>
        </div>

    </section>

</div>


</body>
</html>
